version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kepler_postgres
    restart: always
    environment:
      POSTGRES_USER: kepler
      POSTGRES_PASSWORD: kepler_password
      POSTGRES_DB: kepler_exchange
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kepler_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
